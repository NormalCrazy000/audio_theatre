[project]
name = "copione-audio"
version = "0.1.0"
description = "Genera audio di allenamento per studiare un copione"
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "click>=8.1.8",
    "edge-tts>=7.3.1",
    "pydub>=0.25.1",
    "pypdf>=6.7.0",
]

[project.scripts]
copione-audio = "copione_audio.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Senza "_" pytest raccoglierebbe anche funzioni come `testo_ad_audio`.
python_functions = ["test_*"]
filterwarnings = ["ignore::SyntaxWarning:pydub.*"]
